name: Checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sprawl-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: src/Sprawl.Web/package-lock.json
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Web tests and build
        working-directory: src/Sprawl.Web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: .NET build and tests
        run: |
          dotnet restore Sprawl.slnx --locked-mode
          dotnet build Sprawl.slnx -c Release --no-restore
          dotnet test Sprawl.slnx -c Release --no-build --logger 'console;verbosity=minimal'
      - name: Images build (not published)
        run: |
          docker build --platform linux/amd64 -t sprawl:ci .
          docker build --platform linux/amd64 -f Dockerfile.mcp -t sprawl-mcp:ci .
